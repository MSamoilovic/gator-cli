# Konfiguracija za GoReleaser: `goreleaser release` pravi binarne arhive za
# svaki podrzani sistem, da instalacija ne trazi ni Go ni klonirani repozitorijum.
# Provera bez izdavanja: goreleaser check && goreleaser build --snapshot --clean
version: 2

project_name: gator

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - binary: gator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      # -s -w izbacuju tabele simbola; -X upisuje tag izdanja u cli.version,
      # odakle ga `gator version` cita.
      - -s -w -X github.com/MSamoilovic/gator-cli/internal/cli.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

homebrew_casks:
  - name: gator
    repository:
      owner: MSamoilovic
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/MSamoilovic/gator-cli
    description: A terminal RSS reader backed by PostgreSQL
    caveats: |
      gator needs a PostgreSQL database. Once one is running:

        createdb gator
        gator init --user <your-name>
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gator"]
          end

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore"
      - "^Merge"

release:
  footer: |
    ## Getting started

    Unpack the archive and put `gator` on your PATH. You need a PostgreSQL
    database; everything else `gator` does itself:

    ```
    createdb gator
    gator init --user <your-name>    # writes the config, creates the schema
    gator discover                   # pick some feeds
    gator tui                        # read
    ```

    `gator init` asks for the connection string (or take `--db-url`), proves it
    works, applies the schema from inside the binary, and only then writes
    `~/.gatorconfig.json` at 0600. After upgrading, `gator migrate` applies any
    new migrations the build carries.
