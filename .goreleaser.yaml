# Konfiguracija za GoReleaser: `goreleaser release` pravi binarne arhive za
# svaki podrzani sistem, da instalacija ne trazi ni Go ni klonirani repozitorijum.
# Provera bez izdavanja: goreleaser check && goreleaser build --snapshot --clean
version: 2

project_name: gator

env:
  - GATOR_SERVER_URL={{ if index .Env "GATOR_SERVER_URL" }}{{ .Env.GATOR_SERVER_URL }}{{ end }}

before:
  hooks:
    - go mod tidy

builds:
  - binary: gator
    main: ./cmd/gator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      # -s -w izbacuju tabele simbola; -X upisuje tag izdanja u cli.version,
      # odakle ga `gator version` cita.
      - -s -w -X github.com/MSamoilovic/gator-cli/internal/cli.version={{.Version}}
      - -X github.com/MSamoilovic/gator-cli/internal/cli.defaultServer={{.Env.GATOR_SERVER_URL}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore"
      - "^Merge"

release:
  footer: |
    ## Getting started

    Unpack the archive and put `gator` on your PATH.

    **Someone runs a gator server for you?** They will send you an invite link.
    That is all you need:

    ```
    gator register --link <the link> --email you@example.com <your-name>
    gator discover                   # pick some feeds
    gator tui                        # read
    ```

    **Keeping your feeds on your own machine?** You need a PostgreSQL database;
    everything else `gator` does itself:

    ```
    createdb gator
    gator init --user <your-name>    # writes the config, creates the schema
    gator discover
    gator tui
    ```

    `gator init` asks for the connection string (or take `--db-url`), proves it
    works, applies the schema from inside the binary, and only then writes
    `~/.gatorconfig.json` at 0600. After upgrading, `gator migrate` applies any
    new migrations the build carries.

    ## Verifying the download

    ```
    gh attestation verify <archive> --repo MSamoilovic/gator-cli
    ```

    Report security problems privately, as described in
    [SECURITY.md](https://github.com/MSamoilovic/gator-cli/blob/main/SECURITY.md).
